<svg xmlns="http://www.w3.org/2000/svg" width="940" height="446" viewBox="0 0 940 446" role="img" aria-label="credfence architecture">
  <title>credfence architecture</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#8b949e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
  </defs>
  <rect width="940" height="446" fill="#0d1117"/>
  <text x="30" y="52" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#8b949e" text-anchor="start" letter-spacing="1.4">ASKS</text>
  <rect x="30" y="66" width="220" height="118" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="30" y="66" width="220" height="30" rx="10" fill="#1c2128" stroke="none" stroke-width="1.5"/>
  <rect x="30" y="86" width="220" height="10" rx="0" fill="#1c2128" stroke="none" stroke-width="1.5"/>
  <line x1="30" y1="96" x2="250" y2="96" stroke="#30363d" stroke-width="1" stroke-linecap="round"/>
  <text x="44" y="86" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start">the agent</text>
  <text x="46" y="124" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">Read   Grep   Glob</text>
  <text x="46" y="146" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="12" font-weight="400" fill="#e6edf3" text-anchor="start">Edit   Write   Bash</text>
  <text x="46" y="170" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="start">approving its own tool calls</text>
  <text x="330" y="52" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#8b949e" text-anchor="start" letter-spacing="1.4">REFUSES</text>
  <rect x="330" y="66" width="250" height="176" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="330" y="66" width="250" height="30" rx="10" fill="#1c2128" stroke="none" stroke-width="1.5"/>
  <rect x="330" y="86" width="250" height="10" rx="0" fill="#1c2128" stroke="none" stroke-width="1.5"/>
  <line x1="330" y1="96" x2="580" y2="96" stroke="#30363d" stroke-width="1" stroke-linecap="round"/>
  <text x="344" y="86" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start">PreToolUse guard</text>
  <text x="346" y="122" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">.env   ~/.ssh   *.pem</text>
  <text x="346" y="143" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">~/.netrc   ~/.aws/credentials</text>
  <text x="346" y="164" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">~/Library/Keychains</text>
  <text x="346" y="185" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">vlt get / show / export / rm</text>
  <text x="346" y="206" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">searching the disk for keys</text>
  <text x="346" y="230" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="start">decided before the tool runs</text>
  <text x="660" y="52" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#8b949e" text-anchor="start" letter-spacing="1.4">HOLDS</text>
  <rect x="660" y="66" width="250" height="150" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="660" y="66" width="250" height="30" rx="10" fill="#1c2128" stroke="none" stroke-width="1.5"/>
  <rect x="660" y="86" width="250" height="10" rx="0" fill="#1c2128" stroke="none" stroke-width="1.5"/>
  <line x1="660" y1="96" x2="910" y2="96" stroke="#30363d" stroke-width="1" stroke-linecap="round"/>
  <text x="674" y="86" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start">the vault</text>
  <text x="676" y="124" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#58a6ff" text-anchor="start">store/</text>
  <text x="676" y="138" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="start">one AES-256-GCM file per record</text>
  <text x="676" y="156" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#58a6ff" text-anchor="start">index.json</text>
  <text x="676" y="170" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="start">names and field names only</text>
  <text x="676" y="188" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#58a6ff" text-anchor="start">audit.log</text>
  <text x="676" y="202" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="start">who read what, and when</text>
  <text x="660" y="292" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="600" fill="#8b949e" text-anchor="start" letter-spacing="1.4">UNLOCKS</text>
  <rect x="660" y="306" width="250" height="96" rx="10" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
  <rect x="660" y="306" width="250" height="30" rx="10" fill="#1c2128" stroke="none" stroke-width="1.5"/>
  <rect x="660" y="326" width="250" height="10" rx="0" fill="#1c2128" stroke="none" stroke-width="1.5"/>
  <line x1="660" y1="336" x2="910" y2="336" stroke="#30363d" stroke-width="1" stroke-linecap="round"/>
  <text x="674" y="326" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="12.5" font-weight="600" fill="#e6edf3" text-anchor="start">OS keyring</text>
  <text x="676" y="362" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#e6edf3" text-anchor="start">Secret Service  ·  macOS keychain</text>
  <text x="676" y="382" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8b949e" text-anchor="start">the master key, never a file on disk</text>
  <line x1="250" y1="128" x2="322" y2="128" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="290" y="118" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="middle">tool call</text>
  <path d="M 455 242 L 455 276" fill="none" stroke="#f85149" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="455" y="298" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11.5" font-weight="600" fill="#f85149" text-anchor="middle">denied, and logged</text>
  <path d="M 74 184 L 74 366 L 614 366 L 614 182 L 655 182" fill="none" stroke="#58a6ff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
  <text x="90" y="322" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#58a6ff" text-anchor="start">vlt list · peek · exec</text>
  <text x="90" y="340" font-family="ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,'Liberation Mono',monospace" font-size="11.5" font-weight="400" fill="#58a6ff" text-anchor="start">vlt file · render · request</text>
  <text x="90" y="390" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">structure out, values through, never printed</text>
  <line x1="866" y1="216" x2="866" y2="300" stroke="#8b949e" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="876" y="265" font-family="ui-sans-serif,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif" font-size="11" font-weight="400" fill="#8b949e" text-anchor="start">master key</text>
</svg>
